<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Container with Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="rgba(99, 102, 241, 0.4)" stroke-width="4" />

  <!-- Shield Glow Aura -->
  <path d="M256 70 L390 130 C390 270 330 370 256 430 C182 370 122 270 122 130 Z" fill="url(#shieldGrad)" opacity="0.3" filter="url(#glow)" />

  <!-- Main Security Shield -->
  <path d="M256 80 L380 135 C380 260 325 355 256 410 C187 355 132 260 132 135 Z" fill="url(#shieldGrad)" />
  <path d="M256 94 L366 144 C366 252 316 338 256 388 C196 338 146 252 146 144 Z" fill="#0f172a" />

  <!-- Document Silhouette -->
  <path d="M200 170 H280 L312 202 V320 C312 326.6 306.6 332 300 332 H200 C193.4 332 188 326.6 188 320 V182 C188 175.4 193.4 170 200 170 Z" fill="url(#docGrad)" />
  <!-- Fold corner -->
  <path d="M280 170 V202 H312 Z" fill="#94a3b8" />

  <!-- Document Lines -->
  <line x1="212" y1="230" x2="288" y2="230" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <line x1="212" y1="254" x2="288" y2="254" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <line x1="212" y1="278" x2="256" y2="278" stroke="#475569" stroke-width="6" stroke-linecap="round" />

  <!-- Tamper-Proof Lock Badge -->
  <circle cx="280" cy="300" r="32" fill="#10b981" />
  <path d="M280 286 C274.5 286 270 290.5 270 296 V300 H290 V296 C290 290.5 285.5 286 280 286 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <rect x="268" y="298" width="24" height="18" rx="4" fill="#ffffff" />
  <circle cx="280" cy="307" r="2.5" fill="#065f46" />
</svg>
